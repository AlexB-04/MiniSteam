name: MiniSteam CI

on:
  push:
    branches: [ master, v2-development ]
  pull_request:
    branches: [ master, v2-development ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MiniSteam.slnx

      - name: Build
        run: dotnet build MiniSteam.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MiniSteam.Tests/MiniSteam.Tests.csproj --configuration Release --no-build --verbosity normal
