services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MINISTEAM_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - ministeam-sql:/var/opt/mssql
    restart: unless-stopped

  ministeam:
    build:
      context: .
      dockerfile: MiniSteam/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=MiniSteamDb;User Id=sa;Password=${MINISTEAM_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: "MiniSteam"
      Jwt__Audience: "MiniSteamApi"
      Jwt__Key: "${MINISTEAM_JWT_KEY}"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "30"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    restart: on-failure

volumes:
  ministeam-sql:
